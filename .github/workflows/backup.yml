# Weekly backup of the Supabase database (the free plan has no downloadable backups).
# Dumps the data of the public and auth schemas (plus the public schema, for reference),
# encrypts everything with gpg (AES256) and keeps it as a 30-day artifact of the run.
# The repository is public and anyone logged in to GitHub can download artifacts, so the
# backup is only uploaded encrypted: without BACKUP_PASSPHRASE the job fails before dumping.
# Restore steps: docs/RESPALDOS.md.
# Needs two repository secrets: SUPABASE_DB_PASSWORD and BACKUP_PASSPHRASE.
name: Respaldo de la base

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Respaldar Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_ID: solnlrkmkncsntyptjjm
      SUPABASE_REGION: sa-east-1
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          missing=0
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_PASSWORD (Settings → Secrets and variables → Actions)."
            missing=1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Falta el secreto BACKUP_PASSPHRASE (Settings → Secrets and variables → Actions). Sin él no se hace el respaldo: nunca se sube sin cifrar."
            missing=1
          fi
          exit "$missing"

      - name: Find the database
        # Same connection as "Base de datos": GitHub runners have no IPv6, so the database is
        # reached through Supabase's IPv4 session pooler (aws-0 or aws-1, depending on when
        # the project was created).
        id: db
        run: |
          user="postgres.$SUPABASE_PROJECT_ID"
          for candidate in "aws-1-$SUPABASE_REGION.pooler.supabase.com" "aws-0-$SUPABASE_REGION.pooler.supabase.com"; do
            if version=$(psql "host=$candidate port=5432 user=$user dbname=postgres sslmode=require connect_timeout=15" \
                           -Atc "show server_version_num" 2> /tmp/probe.log); then
              major=$((version / 10000))
              echo "Using $candidate (Postgres $major)"
              {
                echo "host=$candidate"
                echo "user=$user"
                echo "major=$major"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error title=No se pudo conectar a Supabase::¿El proyecto está pausado? $(tr '\n' ' ' < /tmp/probe.log | cut -c1-600)"
          exit 1

      - name: Install pg_dump for the server version
        # pg_dump must be at least as new as the server; the runner's own client may be older.
        # It comes from the official PostgreSQL apt repository (PGDG).
        env:
          PG_MAJOR: ${{ steps.db.outputs.major }}
        run: |
          sudo rm -f /etc/apt/sources.list.d/pgdg*.list
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$PG_MAJOR" > /dev/null
          "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" --version

      - name: Dump, encrypt and check
        # Plain files only live in $RUNNER_TEMP and are deleted at the end; only the encrypted
        # file goes into the upload folder. Nothing from the database is printed.
        env:
          PG_HOST: ${{ steps.db.outputs.host }}
          PG_USER: ${{ steps.db.outputs.user }}
          PG_MAJOR: ${{ steps.db.outputs.major }}
        run: |
          umask 077
          bin="/usr/lib/postgresql/$PG_MAJOR/bin"
          conn="host=$PG_HOST port=5432 user=$PG_USER dbname=postgres sslmode=require"
          stamp=$(date -u +%Y-%m-%d)
          name="supabase-backup-$stamp"
          work="$RUNNER_TEMP/$name"
          mkdir -p "$work" backup-out

          # Data of public and auth. Login sessions, tokens and the audit log are left out
          # (after a restore everyone just signs in again); auth.schema_migrations belongs to
          # Supabase's own auth service.
          "$bin/pg_dump" "$conn" --data-only --no-owner --no-privileges \
            --schema=public --schema=auth \
            --exclude-table-data=auth.schema_migrations \
            --exclude-table-data=auth.sessions \
            --exclude-table-data=auth.refresh_tokens \
            --exclude-table-data=auth.mfa_amr_claims \
            --exclude-table-data=auth.flow_state \
            --exclude-table-data=auth.one_time_tokens \
            --exclude-table-data=auth.audit_log_entries \
            --file="$work/data.sql"

          # Structure of public, for reference (to restore, the migrations of the repo are used).
          "$bin/pg_dump" "$conn" --schema-only --no-owner --schema=public --file="$work/schema.sql"

          # Empties the public tables before loading data.sql: the migrations already insert
          # plans and other catalog rows, which would otherwise be duplicated.
          psql "$conn" -v ON_ERROR_STOP=1 -At -o "$work/prepare.sql" -c \
            "select 'truncate table ' || string_agg(format('%I.%I', schemaname, tablename), ', ') || ';' from pg_tables where schemaname = 'public'"

          {
            echo "Respaldo de Supabase ($SUPABASE_PROJECT_ID), $(date -u '+%Y-%m-%d %H:%M UTC'), Postgres $PG_MAJOR."
            echo "Commit de main: $GITHUB_SHA"
            echo "Cómo restaurarlo: docs/RESPALDOS.md del repositorio."
          } > "$work/LEEME.txt"

          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 \
            --output "backup-out/$name.tar.gz.gpg" "$RUNNER_TEMP/$name.tar.gz" 3<<< "$BACKUP_PASSPHRASE"

          # The encrypted file must decrypt back to the same archive before it is uploaded.
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt "backup-out/$name.tar.gz.gpg" 3<<< "$BACKUP_PASSPHRASE" | cmp - "$RUNNER_TEMP/$name.tar.gz"
          if gzip -t "backup-out/$name.tar.gz.gpg" 2> /dev/null; then
            echo "::error::El archivo a subir no está cifrado."
            exit 1
          fi

          rm -rf "$work" "$RUNNER_TEMP/$name.tar.gz"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "Encrypted backup: $(du -h "backup-out/$name.tar.gz.gpg" | cut -f1)"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: backup-out/*.gpg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
