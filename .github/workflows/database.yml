# Database migrations.
# - In every pull request that touches them: applies them to an empty database and runs
#   the security checks (tools/db-test).
# - When they reach main: applies the new ones to the Supabase project.
#   Needs two repository secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
name: Base de datos

on:
  pull_request:
    paths:
      - "supabase/**"
      - "tools/db-test/**"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "tools/db-test/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Probar migraciones
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Plans seed is up to date
        run: |
          node tools/plans-seed/build.mjs > /tmp/seed.sql
          diff -q /tmp/seed.sql supabase/migrations/20261015120100_seed_plans.sql
      - name: Apply migrations and run security checks
        run: tools/db-test/run.sh

  deploy:
    name: Aplicar en Supabase
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: solnlrkmkncsntyptjjm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltan los secretos SUPABASE_ACCESS_TOKEN y SUPABASE_DB_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Push migrations
        run: supabase db push --yes --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
