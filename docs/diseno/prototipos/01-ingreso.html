<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Primer ingreso — Modo día</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F2F9}
.btn{height:52px;padding:0 26px;border-radius:12px;border:none;font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:12px;font-family:'IBM Plex Sans',sans-serif;font-size:15px;text-align:left;cursor:pointer;color:#24243A}
.t{position:absolute;border-radius:12px}
</style>
</helmet>
<div style="min-height: 100vh; background: #F3F2F9; color: #24243A; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; line-height: 1.45">

  <sc-if value="{{paso1}}" hint-placeholder-val="{{ true }}">
    <main style="display: flex; flex-direction: column; align-items: center; padding: 120px 24px 80px; box-sizing: border-box; text-align: center">
      <div aria-hidden="true" style="position: relative; width: 392px; height: 168px; margin-bottom: 44px">
        <div class="t" style="left: 0; top: 40px; width: 64px; height: 52px; background: #D6F1E3"></div>
        <div class="t" style="left: 0; top: 104px; width: 64px; height: 52px; background: #D6F1E3"></div>
        <div class="t" style="left: 82px; top: 12px; width: 64px; height: 52px; background: #D6F1E3"></div>
        <div class="t" style="left: 82px; top: 76px; width: 64px; height: 52px; background: #FFF1C7"></div>
        <div class="t" style="left: 164px; top: 0; width: 64px; height: 52px; background: #DCEBFB"></div>
        <div class="t" style="left: 164px; top: 64px; width: 64px; height: 52px; background: #E3DEFF"></div>
        <div class="t" style="left: 164px; top: 128px; width: 64px; height: 40px; background: #FFE3D3"></div>
        <div class="t" style="left: 246px; top: 30px; width: 64px; height: 52px; background: #FFFFFF; border: 1.5px solid #8F8DAE; box-sizing: border-box"></div>
        <div class="t" style="left: 246px; top: 94px; width: 64px; height: 52px; background: #DCEBFB"></div>
        <div class="t" style="left: 328px; top: 54px; width: 64px; height: 52px; background: #EEEDF3; border: 1px dashed #B9B7CC; box-sizing: border-box"></div>
      </div>
      <h1 style="margin: 0; font-size: 88px; font-weight: 700; line-height: 1; letter-spacing: -0.035em">[NOMBRE]</h1>
      <div style="margin-top: 18px; font-size: 22px; color: #5D5E76">Tu carrera de FIUBA en un solo lugar</div>
      <button class="btn" onClick="{{irPaso2}}" style="margin-top: 44px; width: 360px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
        Ingresar con tu cuenta @fi.uba.ar
      </button>
    </main>
  </sc-if>

  <sc-if value="{{paso2}}" hint-placeholder-val="{{ false }}">
    <div>
      <header style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 32px; min-height: 68px; background: #FFFFFF; border-bottom: 1px solid #E2E0EE">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 30px; height: 30px; border-radius: 8px; background: #E3DEFF; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #3F3A8C">F</div>
          <span style="font-weight: 700; letter-spacing: 0.02em">[NOMBRE]</span>
        </div>
        <span style="font-size: 13px; color: #5D5E76">sramirez@fi.uba.ar</span>
      </header>
      <main style="max-width: 820px; margin: 0 auto; padding: 44px 24px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
        <h1 style="margin: 0; font-size: 30px; font-weight: 600">¿Qué carrera estudiás?</h1>
        <div role="radiogroup" aria-label="Carrera" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{carreras}}" as="c" hint-placeholder-count="14">
            <button class="opt" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="background: {{c.bg}}; border: {{c.border}}; font-weight: {{c.fw}}">{{c.label}}<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></sc-if></button>
          </sc-for>
        </div>
        <sc-if value="{{variosPlanes}}" hint-placeholder-val="{{ true }}"><div>
          <div style="font-size: 15px; font-weight: 600; margin-bottom: 8px">Plan de estudios</div>
          <div role="radiogroup" aria-label="Plan de estudios" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{planes}}" as="c" hint-placeholder-count="2">
              <button class="opt" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="background: {{c.bg}}; border: {{c.border}}; font-weight: {{c.fw}}"><span>{{c.label}}<span style="display: block; font-size: 13px; font-weight: 400; color: #5D5E76">{{c.sub}}</span></span><sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></sc-if></button>
            </sc-for>
          </div>
        </div></sc-if>
        <div style="display: flex; justify-content: flex-end">
          <a href="MapaInicial.dc.html" class="btn" style="display: inline-flex; align-items: center; height: 46px; font-size: 15px; background: {{accent}}; color: #FFFFFF">Continuar</a>
        </div>
      </main>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5B5BD6","options":["#5B5BD6","#2F7F76","#B54D73","#B85A2E"]},"$preview":{"width":1440,"height":900}}'>
// Fuente: fi.uba.ar/grado/carreras/<carrera>/plan-de-estudios (octubre 2026). El primero es el vigente.
const CARRERAS = [
  ['Bioingeniería', ['2024']],
  ['Ing. Civil', ['2023', '2009']],
  ['Ing. Electrónica', ['2023', '2009']],
  ['Ing. en Agrimensura', ['2023', '2006']],
  ['Ing. en Alimentos', ['2024', '2001']],
  ['Ing. en Energía Eléctrica', ['2024', '2009']],
  ['Ing. en Informática', ['2023', '1986']],
  ['Ing. en Petróleo', ['2023', '2015']],
  ['Ing. Industrial', ['2023', '2011']],
  ['Ing. Mecánica', ['2024', '1986']],
  ['Ing. Naval', ['2024', '1986']],
  ['Ing. Química', ['2023', '1986']],
  ['Lic. en Análisis de Sistemas', ['1986']]
];
// Nombre con el que figura el plan viejo cuando la carrera cambió de nombre
const NOMBRE_VIEJO = { 'Ing. en Energía Eléctrica': 'Ing. Electricista', 'Ing. Naval': 'Ing. Naval y Mecánica' };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paso: 1, carrera: 'Ing. Industrial', plan: '2023' };
  }
  renderVals() {
    const acc = this.props.accent ?? '#5B5BD6';
    const s = this.state;
    const planes = CARRERAS.find((c) => c[0] === s.carrera)[1];
    const opt = (on, label, pick, sub) => ({
      label: label, sub: sub || '', on: on, pick: pick,
      bg: on ? '#EFEDFF' : '#FFFFFF', border: on ? '1.5px solid ' + acc : '1px solid #E2E0EE', fw: on ? 600 : 400
    });
    return {
      accent: acc,
      paso1: s.paso === 1,
      paso2: s.paso === 2,
      irPaso2: () => this.setState({ paso: 2 }),
      carreras: CARRERAS.map((c) => opt(s.carrera === c[0], c[0], () => this.setState({ carrera: c[0], plan: c[1][0] }))),
      planes: planes.map((p, i) => opt(s.plan === p, 'Plan ' + p, () => this.setState({ plan: p }), i === 0 ? 'Vigente' : NOMBRE_VIEJO[s.carrera] ? NOMBRE_VIEJO[s.carrera] : 'Para quienes ingresaron antes')),
      variosPlanes: planes.length > 1
    };
  }
}
</script>
</body>
</html>
